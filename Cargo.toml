[workspace]
resolver = "2"
members = [
    "contracts/reputation_treasury",
    "contracts/knowledge_marketplace",
]

[workspace.dependencies]
soroban-sdk = "21.4.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
