name: Main Deployment CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build Next.js 15 & Validate Soroban Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Test Suite
        run: npm run test

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Validate Deployment Artifacts
        run: echo "Production deployment build completed successfully!"
