name: PR Verification CI

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  soroban-contract-tests:
    name: Soroban Smart Contract Rust Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain & Wasm Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Soroban Cargo Unit & Inter-Contract Tests
        run: cargo test --all

  frontend-ci:
    name: Frontend Lint, Typecheck & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Vitest Unit & Integration Tests
        run: npm run test
